<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savings Page</title>
  <link rel="stylesheet" href="s.css">
</head>

<body>

  <div class="heading">
    <h1>Monthly Savings</h1>
  </div>

  <main class="container">

    <!-- INPUT BOX -->
    <form class="saving-form">

      <div class="input-box">
        <label>Enter Saving Amount</label>
        <input type="number" class="saving-input" placeholder="Enter amount">
      </div>

      <button class="save-btn">Add Saving</button>

    </form>

    <!-- TABLE -->
    <table class="saving-table">

      <thead>
        <tr>
          <th>Save</th>
          <th>Amount</th>
          <th>Delete</th>

        </tr>
      </thead>

      <tbody class="saving-body">
        <!-- JS will add rows here -->
      </tbody>

    </table>

  </main>

  <script src="s.js"></script>
</body>
</html>
