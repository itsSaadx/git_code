<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="E.css">
</head>

<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="link"><a href="Page2/Income.html" target="_blank">Add Income</a></div>
    <div class="link"><a href="Page3/Expense.html" target="_blank">Add Expense</a></div>
    <div class="link"><a href="Page4/s.html" target="_blank">Saving</a></div>
  </aside>

  <!-- Main Container -->
  <main class="container">

    <!-- Heading -->
    <div class="heading">
      <h1>Track Your Money</h1>
      <h3>Where it actually goes</h3>
    </div>

    <!-- New Div Below Heading -->
    <div class="summary-box">
      <p>Your financial overview</p>
    </div>

    <!-- Showing Section -->
    <div class="showing">

      <div class="card income">
        <h2>Income</h2>
        <p class="inc">₹500000</p>
      </div>

      <div class="card balance">
        <h2>Balance</h2>
        <p class="bal">₹40000</p>
      </div>

      <div class="card expense">
        <h2>Expense</h2>
        <p class="exp">₹20000</p>
      </div>

      <div class="card saving">
        <h2>Saving</h2>
        <p class="sav">120</p>
      </div>

    </div>

  </main>
<script src="Page2/Income.js"></script>
<script src="Page3/Expense.js"></script>
<script src="Page4/s.js"></script>
<script src="E.js"></script>


</body>
</html>
