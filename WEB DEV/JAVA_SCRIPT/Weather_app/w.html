<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="w.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="enter city name" spellcheck="false">
            <button><img src="imgs/search.png" alt=""></button>
        </div>

        <div class="weather">
            <img src="imgs/rain.png" class="weather-icon">
            <h1 class="temp">22°C</h1>
            <h2 class="city">Amravati</h2>
            <div class="details">

                <div class="col align-l">
                    <img src="imgs/humidity.png" alt="">
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humadity</p>
                    </div>
                </div>

                 <div class="col align-r" >
                    <img src="imgs/wind.png" alt="">
                    <div>
                        <p class="wind">15 Km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="w.js"></script>
</body>
</html>
